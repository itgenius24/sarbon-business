<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Sarbon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f6f7f8;
            color: #101828;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #26BD49;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon::before {
            content: '';
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            position: relative;
        }

        .icon::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #26BD49;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #101828;
        }

        p {
            font-size: 16px;
            color: #667085;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .button {
            background: #26BD49;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .button:hover {
            background: #22a03d;
        }

        .features {
            margin-top: 32px;
            text-align: left;
        }

        .features h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #101828;
        }

        .feature-list {
            list-style: none;
        }

        .feature-list li {
            padding: 8px 0;
            color: #667085;
            position: relative;
            padding-left: 24px;
        }

        .feature-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #26BD49;
            font-weight: bold;
        }

        .status {
            margin-top: 24px;
            padding: 12px;
            background: #fef3f2;
            border: 1px solid #fda29b;
            border-radius: 8px;
            color: #b42318;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"></div>
        <h1>You're Offline</h1>
        <p>It looks like you're not connected to the internet. Some features may not be available right now.</p>
        
        <button class="button" onclick="window.location.reload()">
            Try Again
        </button>

        <div class="features">
            <h3>Available Offline:</h3>
            <ul class="feature-list">
                <li>View previously loaded cargo listings</li>
                <li>Access cached vehicle information</li>
                <li>Browse your saved routes</li>
                <li>View contact information</li>
            </ul>
        </div>

        <div class="status" id="status">
            <strong>Connection Status:</strong> Offline
        </div>
    </div>

    <script>
        // Check connection status
        function updateConnectionStatus() {
            const status = document.getElementById('status');
            if (navigator.onLine) {
                status.innerHTML = '<strong>Connection Status:</strong> Online - <a href="/" style="color: #26BD49;">Return to App</a>';
                status.style.background = '#ecfdf3';
                status.style.borderColor = '#abefc6';
                status.style.color = '#079455';
            } else {
                status.innerHTML = '<strong>Connection Status:</strong> Offline';
                status.style.background = '#fef3f2';
                status.style.borderColor = '#fda29b';
                status.style.color = '#b42318';
            }
        }

        // Listen for connection changes
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        
        // Initial check
        updateConnectionStatus();

        // Auto-reload when back online
        window.addEventListener('online', function() {
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        });
    </script>
</body>
</html>
